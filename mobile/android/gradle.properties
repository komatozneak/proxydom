# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false

# Flutter (Шаг 19 — закреплено явно чтобы build.gradle.kts не сбрасывал)
flutter.minSdkVersion=26
flutter.compileSdkVersion=36
flutter.targetSdkVersion=36
flutter.versionCode=1
flutter.versionName=0.1.0
# AGP 8.11: optimized resource shrinking for release builds
android.enableOptimizedResourceShrinking=true