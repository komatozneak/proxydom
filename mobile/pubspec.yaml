name: teremok_connect
description: Teremok Connect VPN client
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations (0.19 on CI Flutter 3.24, 0.20 on local 3.27+).
  intl: any
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  # env-конфиг используем через const — пока без package

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Offline copies of sing-box rule-sets (runtime still uses remote URLs).
    - assets/rules/geosite-category-ru.srs
    - assets/rules/geosite-tld-ru.srs
    - assets/rules/geoip-ru.srs
