name: teremok_connect
description: Teremok Connect VPN client
publish_to: 'none'
version: 1.0.0+2041

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # flutter_localizations pins intl (0.20.x on Flutter 3.35, CI and local).
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  dio: ^5.7.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  package_info_plus: ^8.3.1
  device_info_plus: ^10.1.2
  url_launcher: ^6.3.1
  phosphor_flutter: ^2.1.0
  flutter_svg: 2.2.2
  rive: ^0.14.10
  qr_flutter: ^4.1.0
  app_links: ^6.4.0
  # Living House Signal Nest — see SignalNestHero + assets/rive/.
  # env-конфиг используем через const — пока без package

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Brand / onboarding (Figma zinc+honey).
    # Directory entries are NOT recursive — nest paths must be listed.
    - assets/brand/
    - assets/brand/connect/s1-flat-launcher.png
    - assets/brand/sites/claude.png
    - assets/icon/mono_teremok.png
    - assets/icon/nav_vpn_teremok.png
    - assets/icon/logo_mark_nav.png
    - assets/rive/signal_nest_connect.riv
    - assets/flags/
    - assets/flags/LICENSE
    # DedProxy-style Google/YouTube force-proxy CIDRs (public goog.json).
    - assets/rules/youtube-google.cidr
    # PR #35 textures/empty_states intentionally NOT bundled (see
    # assets/brand/DEPRECATED-PR35.md — FLUX Klein 9B non-commercial).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
# Android 13+ themed icons: background + foreground + monochrome.
# Regenerate:
#   python tool/generate_adaptive_icon.py
#   dart run flutter_launcher_icons
# Source: Living House mascot (s1-flat-launcher.png) — not oak/moss shield.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/fg_teremok.png
  adaptive_icon_background: "#FAF8F3"
  adaptive_icon_foreground: assets/icon/fg_teremok.png
  adaptive_icon_monochrome: assets/icon/mono_teremok.png
  min_sdk_android: 26
