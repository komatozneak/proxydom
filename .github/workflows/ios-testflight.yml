name: iOS TestFlight

# Official Flutter + Codemagic CLI path:
# https://docs.flutter.dev/deployment/ios#create-a-build-archive-with-codemagic-cli-tools
# https://blog.codemagic.io/deploy-your-app-to-app-store-with-codemagic-cli-tools-and-github-actions/
# Actions → iOS TestFlight → Run workflow → IPA → App Store Connect / TestFlight.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload IPA to App Store Connect"
        required: false
        default: true
        type: boolean

env:
  FLUTTER_VERSION: "3.35.1"
  HYSTERIA_TAG: "v2.13.0"
  GO_VERSION: "1.25.x"
  APP_BUNDLE_ID: su.proxydom.app
  TUNNEL_BUNDLE_ID: su.proxydom.app.VpnTunnelProvider

jobs:
  testflight:
    name: Build IPA + TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Check Apple secrets
        run: |
          fail=0
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
            APP_STORE_CONNECT_PRIVATE_KEY BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing GitHub secret / env: $name"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "See docs/ops/apple-testflight-checklist.md"
            exit 1
          fi

      # Apple (2026): App Store Connect requires iOS 26 SDK / Xcode 26.
      # macos-15 ships Xcode_26.3.app. Flutter 3.35.1 still archives with it.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codemagic CLI tools
        run: python -m pip install codemagic-cli-tools

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mobile/android/hysteria-bind/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The committed graph. build-ios.sh runs the guard again after go mod tidy,
      # which is the graph the xcframework is actually built from (ADR 036).
      - name: License guard
        working-directory: mobile/android/hysteria-bind
        run: go test -count=1 -run 'TestLicenseGuard$' .

      - name: Build Hy2bind.xcframework
        working-directory: mobile/android/hysteria-bind
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash build-ios.sh
        env:
          HYSTERIA_TAG: ${{ env.HYSTERIA_TAG }}

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Set up keychain
        run: keychain initialize

      - name: Fetch signing files
        working-directory: mobile
        run: |
          set -euo pipefail

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nodes -nocerts \
              -passin pass:"$P12_PASSWORD" 2>/dev/null \
              | openssl rsa -out "$RUNNER_TEMP/cert_key" 2>/dev/null; then
            openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nodes -nocerts -legacy \
              -passin pass:"$P12_PASSWORD" \
              | openssl rsa -out "$RUNNER_TEMP/cert_key"
          fi
          chmod 600 "$RUNNER_TEMP/cert_key"
          test -s "$RUNNER_TEMP/cert_key"

          # --strict-match-identifier: do not also match RunnerTests
          # (su.proxydom.app.RunnerTests).
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key="@file:$RUNNER_TEMP/cert_key" \
            --create \
            --strict-match-identifier
          app-store-connect fetch-signing-files "$TUNNEL_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key="@file:$RUNNER_TEMP/cert_key" \
            --create \
            --strict-match-identifier

      - name: Set up signing certificate
        run: keychain add-certificates

      - name: Generate Flutter iOS project
        working-directory: mobile
        # --no-codesign skips Flutter 3.35's Development-cert lookup
        # (Distribution-only CI). Pods + Generated.xcconfig still run.
        # Must run before use-profiles so pod install does not reset signing.
        run: flutter build ios --release --config-only --no-codesign

      - name: Set up code signing settings on Xcode project
        working-directory: mobile
        run: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --warn-only \
            --code-signing-setup-verbose-logging
          echo "=== export_options.plist ==="
          cat "$HOME/export_options.plist"
          echo "=== codesigning identities ==="
          security find-identity -v -p codesigning

      - name: Build IPA
        working-directory: mobile
        # Official Codemagic App Store sample: workspace + scheme only.
        # Do not pass --config (becomes invalid xcodebuild -config, exit 64).
        # Do not pass adhoc --archive-flags destination (Codemagic docs: adhoc
        # profiles only). App Store archive uses the scheme Archive action.
        # --disable-xcpretty: xcpretty hides the real xcodebuild error.
        run: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --no-show-build-settings \
            --disable-xcpretty \
            --export-options-plist "$HOME/export_options.plist" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual"

      - name: Upload xcodebuild logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: /tmp/xcodebuild_logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxydom-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Scan IPA for selling copy
        working-directory: mobile
        run: |
          set -euo pipefail
          ipa="$(ls build/ios/ipa/*.ipa | head -n 1)"
          tmp="$(mktemp -d)"
          unzip -q "$ipa" -d "$tmp"
          app="$(find "$tmp" -type d -name '*.app' | head -n 1)"
          found=0
          for token in 'Premium' 'Премиум' 'Platega' 'Тариф' 'промокод' 'Teremok VPN' 'vpn_teremok_bot' 'квота' 't.me/' '₽' 'Купить' 'Оплатить'; do
            if strings -a "$app/Runner" | grep -Fq "$token"; then
              echo "FAIL: '$token' in Runner"
              found=1
            fi
          done
          tunnel="$(find "$app" -type f -name 'VpnTunnelProvider' | head -n 1)"
          if [ -n "$tunnel" ] && strings -a "$tunnel" | grep -Fq 'Teremok VPN'; then
            echo "FAIL: name in tunnel"
            found=1
          fi
          exit "$found"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        working-directory: mobile
        run: |
          ipa="$(ls build/ios/ipa/*.ipa | head -n 1)"
          app-store-connect publish --path "$ipa"

      - name: Restore login keychain
        if: always()
        run: keychain use-login || true
