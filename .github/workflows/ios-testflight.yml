name: iOS TestFlight

# Official Flutter + Codemagic CLI path:
# https://docs.flutter.dev/deployment/ios#create-a-build-archive-with-codemagic-cli-tools
# https://blog.codemagic.io/deploy-your-app-to-app-store-with-codemagic-cli-tools-and-github-actions/
# Actions → iOS TestFlight → Run workflow → IPA → App Store Connect / TestFlight.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload IPA to App Store Connect"
        required: false
        default: true
        type: boolean
      upload_artifact:
        description: "Also keep the IPA as a workflow artifact (this repository is public: artifacts are downloadable by anyone)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.35.1"
  APP_BUNDLE_ID: su.proxydom.app
  TUNNEL_BUNDLE_ID: su.proxydom.app.VpnTunnelProvider

jobs:
  testflight:
    name: Build IPA + TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    # Repository secrets reach this job; the environment adds a gate (and, if
    # you define them there, its own copy of the five Apple secrets). Point it
    # at an environment with "Required reviewers" so an Apple credential can
    # only be used by a run somebody approved. Without that setting the
    # environment is simply a name and nothing changes.
    environment: appstore
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Apple secrets
        run: |
          fail=0
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
            APP_STORE_CONNECT_PRIVATE_KEY BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing GitHub secret / env: $name"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Missing GitHub secrets. Add these five under Settings → Secrets and variables → Actions:"
            echo "  APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY, BUILD_CERTIFICATE_BASE64, P12_PASSWORD"
            echo "(they feed the APP_STORE_CONNECT_* env vars named above)"
            exit 1
          fi

      # Apple (2026): App Store Connect requires iOS 26 SDK / Xcode 26.
      # macos-15 ships Xcode_26.3.app. Flutter 3.35.1 still archives with it.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codemagic CLI tools
        run: python -m pip install codemagic-cli-tools

      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/android/hysteria-bind/go.mod
          cache-dependency-path: mobile/android/hysteria-bind/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # build-ios.sh refuses an untidy graph and runs the license guard on the
      # committed one before it binds.
      - name: Build Hy2bind.xcframework
        working-directory: mobile/android/hysteria-bind
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash build-ios.sh

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Set up keychain
        run: keychain initialize

      - name: Fetch signing files
        working-directory: mobile
        run: |
          set -euo pipefail

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nodes -nocerts \
              -passin pass:"$P12_PASSWORD" 2>/dev/null \
              | openssl rsa -out "$RUNNER_TEMP/cert_key" 2>/dev/null; then
            openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nodes -nocerts -legacy \
              -passin pass:"$P12_PASSWORD" \
              | openssl rsa -out "$RUNNER_TEMP/cert_key"
          fi
          chmod 600 "$RUNNER_TEMP/cert_key"
          test -s "$RUNNER_TEMP/cert_key"

          # The first --create (run 38037626182) minted these profiles before
          # App Groups was saved on the App IDs. fetch-signing-files reuses an
          # existing IOS_APP_STORE profile, so the archive still rejects
          # group.su.proxydom.app. Delete those two by name; --create below
          # mints replacements from the current App ID capabilities.
          python - <<'PY'
          import json, subprocess
          stale = {
              "Proxy Dom iOS ios_app_store 1791620707",
              "Proxy Dom VPN Extension ios_app_store 1791620709",
          }
          raw = subprocess.check_output(
              [
                  "app-store-connect", "profiles", "list",
                  "--type", "IOS_APP_STORE",
                  "--json",
                  "--no-color",
                  "-s",
              ],
              text=True,
          )
          raw = raw.strip()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              data = None
              for index, char in enumerate(raw):
                  if char not in "[{":
                      continue
                  try:
                      data = json.loads(raw[index:])
                      break
                  except json.JSONDecodeError:
                      continue
              if data is None:
                  raise SystemExit("profiles list did not return JSON")
          if isinstance(data, dict):
              data = data.get("data") or data.get("profiles") or []
          for item in data:
              attrs = item.get("attributes") or {}
              name = attrs.get("name") or item.get("name")
              profile_id = item.get("id")
              if name in stale and profile_id:
                  print(f"Deleting stale profile {name} ({profile_id})")
                  subprocess.check_call(
                      [
                          "app-store-connect", "profiles", "delete",
                          profile_id,
                          "--ignore-not-found",
                      ]
                  )
          PY

          # --strict-match-identifier: do not also match RunnerTests
          # (su.proxydom.app.RunnerTests).
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key="@file:$RUNNER_TEMP/cert_key" \
            --create \
            --strict-match-identifier
          app-store-connect fetch-signing-files "$TUNNEL_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key="@file:$RUNNER_TEMP/cert_key" \
            --create \
            --strict-match-identifier

      - name: Set up signing certificate
        run: keychain add-certificates

      - name: Generate Flutter iOS project
        working-directory: mobile
        # --no-codesign skips Flutter 3.35's Development-cert lookup
        # (Distribution-only CI). Pods + Generated.xcconfig still run.
        # Must run before use-profiles so pod install does not reset signing.
        run: flutter build ios --release --config-only --no-codesign

      - name: Set up code signing settings on Xcode project
        working-directory: mobile
        run: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --warn-only \
            --code-signing-setup-verbose-logging
          echo "=== export_options.plist ==="
          cat "$HOME/export_options.plist"
          echo "=== codesigning identities ==="
          security find-identity -v -p codesigning

      - name: Build IPA
        working-directory: mobile
        env:
          # xcode_backend reads these when xcodebuild runs the Flutter phase.
          # They keep the Dart AOT snapshot obfuscated and put the symbol map
          # outside the .app/.ipa, in mobile/build/symbols.
          DART_OBFUSCATION: "true"
          SPLIT_DEBUG_INFO: build/symbols
        # Official Codemagic App Store sample: workspace + scheme only.
        # Do not pass --config (becomes invalid xcodebuild -config, exit 64).
        # Do not pass adhoc --archive-flags destination (Codemagic docs: adhoc
        # profiles only). App Store archive uses the scheme Archive action.
        # --disable-xcpretty: xcpretty hides the real xcodebuild error.
        run: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --no-show-build-settings \
            --disable-xcpretty \
            --export-options-plist "$HOME/export_options.plist" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual"

      # The symbol map is a separate artifact: it must never be inside the
      # .app or the .ipa, but crash reports need it after TestFlight.
      - name: Upload Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: proxydom-ios-dart-symbols
          path: mobile/build/symbols/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload xcodebuild logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: /tmp/xcodebuild_logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      # A public repository makes an artifact public: anyone with read access
      # can download it, and read access is the whole internet. The IPA is a
      # signed build of the app, so keeping it is opt-in and short-lived. The
      # TestFlight upload above does not need this artifact.
      - name: Upload IPA artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxydom-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Scan IPA for selling copy
        working-directory: mobile
        run: |
          set -euo pipefail
          ipa="$(ls build/ios/ipa/*.ipa | head -n 1)"
          tmp="$(mktemp -d)"
          unzip -q "$ipa" -d "$tmp"
          app="$(find "$tmp" -type d -name '*.app' | head -n 1)"
          found=0
          for token in 'Premium' 'Премиум' 'Platega' 'Тариф' 'промокод' 'Teremok VPN' 'vpn_teremok_bot' 'квота' 't.me/' '₽' 'Купить' 'Оплатить'; do
            if strings -a "$app/Runner" | grep -Fq "$token"; then
              echo "FAIL: '$token' in Runner"
              found=1
            fi
          done
          tunnel="$(find "$app" -type f -name 'VpnTunnelProvider' | head -n 1)"
          if [ -n "$tunnel" ] && strings -a "$tunnel" | grep -Fq 'Teremok VPN'; then
            echo "FAIL: name in tunnel"
            found=1
          fi
          exit "$found"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        working-directory: mobile
        run: |
          ipa="$(ls build/ios/ipa/*.ipa | head -n 1)"
          app-store-connect publish --path "$ipa"

      - name: Restore login keychain
        if: always()
        run: keychain use-login || true
