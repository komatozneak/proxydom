name: iOS TestFlight

# Owner: App Store Connect app + GitHub secrets (docs/ops/apple-testflight-checklist.md).
# Actions → iOS TestFlight → Run workflow → IPA uploads to App Store Connect → TestFlight.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload IPA to App Store Connect"
        required: false
        default: true
        type: boolean

env:
  FLUTTER_VERSION: "3.35.1"
  HYSTERIA_TAG: "v2.6.2"
  GO_VERSION: "1.25.x"

jobs:
  testflight:
    name: Build IPA + TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APP_PROVISION_BASE64: ${{ secrets.APP_PROVISION_BASE64 }}
      TUNNEL_PROVISION_BASE64: ${{ secrets.TUNNEL_PROVISION_BASE64 }}
      APP_PROFILE_NAME: ${{ secrets.APP_PROFILE_NAME }}
      TUNNEL_PROFILE_NAME: ${{ secrets.TUNNEL_PROFILE_NAME }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Check Apple secrets
        run: |
          fail=0
          for name in APPLE_TEAM_ID APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY \
            BUILD_CERTIFICATE_BASE64 P12_PASSWORD APP_PROVISION_BASE64 TUNNEL_PROVISION_BASE64 \
            APP_PROFILE_NAME TUNNEL_PROFILE_NAME; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing GitHub secret: $name"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "See docs/ops/apple-testflight-checklist.md"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mobile/android/hysteria-bind/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Hy2bind.xcframework
        working-directory: mobile/android/hysteria-bind
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash build-ios.sh
        env:
          HYSTERIA_TAG: ${{ env.HYSTERIA_TAG }}

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install provisioning profiles
        run: |
          # Xcode 16+: ~/Library/Developer/Xcode/UserData/Provisioning Profiles/<UUID>.mobileprovision
          # Keep legacy MobileDevice path for older tooling.
          legacy="$HOME/Library/MobileDevice/Provisioning Profiles"
          modern="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$legacy" "$modern"
          install_profile() {
            local b64="$1"
            local tmp="$2"
            echo "$b64" | base64 --decode > "$tmp"
            local uuid
            uuid="$(security cms -D -i "$tmp" | plutil -extract UUID raw -)"
            echo "Installed profile UUID=$uuid"
            cp "$tmp" "$legacy/${uuid}.mobileprovision"
            cp "$tmp" "$modern/${uuid}.mobileprovision"
          }
          install_profile "$APP_PROVISION_BASE64" /tmp/app.mobileprovision
          install_profile "$TUNNEL_PROVISION_BASE64" /tmp/tunnel.mobileprovision

      - name: Verify codesigning identity
        run: |
          security find-identity -v -p codesigning
          count="$(security find-identity -v -p codesigning | grep -c 'Apple Distribution' || true)"
          if [ "$count" -lt 1 ]; then
            echo "No Apple Distribution identity in keychain — check BUILD_CERTIFICATE_BASE64 / P12_PASSWORD"
            exit 1
          fi

      - name: Apply Manual signing
        working-directory: mobile
        run: python3 ios/ci/apply_signing.py

      - name: Inject team into Flutter xcconfigs
        working-directory: mobile
        run: |
          # Flutter skips Development-cert lookup only when DEVELOPMENT_TEAM
          # is already visible in xcodebuild build settings (code_signing.dart).
          for f in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig; do
            {
              echo ""
              echo "// CI Manual signing (ios-testflight.yml)"
              echo "DEVELOPMENT_TEAM=${APPLE_TEAM_ID}"
              echo "CODE_SIGN_STYLE=Manual"
              echo "CODE_SIGN_IDENTITY=Apple Distribution"
            } >> "$f"
            echo "--- $f ---"
            cat "$f"
          done

      - name: Allow Apple Distribution in flutter_tools
        # Flutter 3.35 regex only matches Develop(ment|er); skips Distribution.
        # https://github.com/flutter/flutter/issues/176636
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/lib/src/ios/code_signing.dart"
          text = path.read_text()
          old = r'^\s*\d+\).+"(.+Develop(ment|er).+)"$'
          new = r'^\s*\d+\).+"(.+)"$'
          if old not in text:
              raise SystemExit(f"regex not found in {path}")
          path.write_text(text.replace(old, new, 1))
          print(f"patched identity regex in {path}")
          PY
          # Snapshot tools so the patch is picked up (no stale kernel).
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.stamp" \
                "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot" || true

      - name: Write ExportOptions.plist
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path("ios/ExportOptions.plist.example").read_text()
          src = src.replace("APPLE_TEAM_ID", os.environ["APPLE_TEAM_ID"])
          src = src.replace("APP_PROFILE_NAME", os.environ["APP_PROFILE_NAME"])
          src = src.replace("TUNNEL_PROFILE_NAME", os.environ["TUNNEL_PROFILE_NAME"])
          Path("ios/ExportOptions.plist").write_text(src)
          print("wrote ios/ExportOptions.plist")
          PY

      - name: Build IPA
        working-directory: mobile
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: teremok-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        working-directory: mobile
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          ipa=(build/ios/ipa/*.ipa)
          xcrun altool --upload-app --type ios \
            --file "${ipa[0]}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
