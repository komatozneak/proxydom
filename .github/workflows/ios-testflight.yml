name: iOS TestFlight

# Official Flutter CI path: Codemagic CLI tools
# https://docs.flutter.dev/deployment/ios#create-a-build-archive-with-codemagic-cli-tools
# Actions → iOS TestFlight → Run workflow → IPA → App Store Connect / TestFlight.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload IPA to App Store Connect"
        required: false
        default: true
        type: boolean

env:
  FLUTTER_VERSION: "3.35.1"
  HYSTERIA_TAG: "v2.6.2"
  GO_VERSION: "1.25.x"
  APP_BUNDLE_ID: online.teremokconnect.app
  TUNNEL_BUNDLE_ID: online.teremokconnect.app.VpnTunnelProvider

jobs:
  testflight:
    name: Build IPA + TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Codemagic CLI / App Store Connect API
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Check Apple secrets
        run: |
          fail=0
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER \
            APP_STORE_CONNECT_PRIVATE_KEY BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing GitHub secret / env: $name"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "See docs/ops/apple-testflight-checklist.md"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mobile/android/hysteria-bind/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Codemagic CLI tools
        run: pip3 install --user codemagic-cli-tools
        # https://docs.flutter.dev/deployment/ios#create-a-build-archive-with-codemagic-cli-tools

      - name: Build Hy2bind.xcframework
        working-directory: mobile/android/hysteria-bind
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash build-ios.sh
        env:
          HYSTERIA_TAG: ${{ env.HYSTERIA_TAG }}

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Set up code signing (Codemagic CLI)
        working-directory: mobile
        run: |
          set -euo pipefail
          export PATH="$HOME/Library/Python/3.13/bin:$HOME/Library/Python/3.12/bin:$HOME/.local/bin:$PATH"

          # 1) Temporary keychain (Flutter docs)
          keychain initialize

          # 2) Private key from Apple Distribution .p12 (Flutter docs openssl step)
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nodes -nocerts \
              -passin pass:"$P12_PASSWORD" 2>/dev/null \
              | openssl rsa -out "$RUNNER_TEMP/cert_key" 2>/dev/null; then
            # OpenSSL 3 on some runners needs -legacy for older p12 bags
            openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nodes -nocerts -legacy \
              -passin pass:"$P12_PASSWORD" \
              | openssl rsa -out "$RUNNER_TEMP/cert_key"
          fi
          chmod 600 "$RUNNER_TEMP/cert_key"
          test -s "$RUNNER_TEMP/cert_key"

          # 3) Fetch App Store profiles + cert for app and Packet Tunnel extension
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key="@file:$RUNNER_TEMP/cert_key" \
            --create
          app-store-connect fetch-signing-files "$TUNNEL_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key="@file:$RUNNER_TEMP/cert_key" \
            --create

          # 4) Add fetched certificates to the keychain
          keychain add-certificates

          # 5) Wire profiles into Xcode project + write $HOME/export_options.plist
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --code-signing-setup-verbose-logging

          echo "=== export_options.plist ==="
          cat "$HOME/export_options.plist"
          echo "=== codesigning identities ==="
          security find-identity -v -p codesigning

      - name: Build IPA
        working-directory: mobile
        run: |
          export PATH="$HOME/Library/Python/3.13/bin:$HOME/Library/Python/3.12/bin:$HOME/.local/bin:$PATH"
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: teremok-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        working-directory: mobile
        run: |
          export PATH="$HOME/Library/Python/3.13/bin:$HOME/Library/Python/3.12/bin:$HOME/.local/bin:$PATH"
          ipa="$(ls build/ios/ipa/*.ipa | head -n 1)"
          app-store-connect publish --path "$ipa"

      - name: Restore login keychain
        if: always()
        run: |
          export PATH="$HOME/Library/Python/3.13/bin:$HOME/Library/Python/3.12/bin:$HOME/.local/bin:$PATH"
          keychain use-login || true
