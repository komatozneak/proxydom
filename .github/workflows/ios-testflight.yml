name: iOS TestFlight

# Owner: App Store Connect app + GitHub secrets (docs/ops/apple-testflight-checklist.md).
# Actions → iOS TestFlight → Run workflow → IPA uploads to App Store Connect → TestFlight.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload IPA to App Store Connect"
        required: false
        default: true
        type: boolean

env:
  FLUTTER_VERSION: "3.35.1"
  HYSTERIA_TAG: "v2.6.2"
  GO_VERSION: "1.25.x"

jobs:
  testflight:
    name: Build IPA + TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APP_PROVISION_BASE64: ${{ secrets.APP_PROVISION_BASE64 }}
      TUNNEL_PROVISION_BASE64: ${{ secrets.TUNNEL_PROVISION_BASE64 }}
      APP_PROFILE_NAME: ${{ secrets.APP_PROFILE_NAME }}
      TUNNEL_PROFILE_NAME: ${{ secrets.TUNNEL_PROFILE_NAME }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Check Apple secrets
        run: |
          fail=0
          for name in APPLE_TEAM_ID APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY \
            BUILD_CERTIFICATE_BASE64 P12_PASSWORD APP_PROVISION_BASE64 TUNNEL_PROVISION_BASE64 \
            APP_PROFILE_NAME TUNNEL_PROFILE_NAME; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing GitHub secret: $name"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "See docs/ops/apple-testflight-checklist.md"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mobile/android/hysteria-bind/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Hy2bind.xcframework
        working-directory: mobile/android/hysteria-bind
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash build-ios.sh
        env:
          HYSTERIA_TAG: ${{ env.HYSTERIA_TAG }}

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install provisioning profiles
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APP_PROVISION_BASE64" | base64 --decode > /tmp/app.mobileprovision
          echo "$TUNNEL_PROVISION_BASE64" | base64 --decode > /tmp/tunnel.mobileprovision
          cp /tmp/app.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp /tmp/tunnel.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Apply Manual signing
        working-directory: mobile
        run: python3 ios/ci/apply_signing.py

      - name: Write ExportOptions.plist
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path("ios/ExportOptions.plist.example").read_text()
          src = src.replace("APPLE_TEAM_ID", os.environ["APPLE_TEAM_ID"])
          src = src.replace("APP_PROFILE_NAME", os.environ["APP_PROFILE_NAME"])
          src = src.replace("TUNNEL_PROFILE_NAME", os.environ["TUNNEL_PROFILE_NAME"])
          Path("ios/ExportOptions.plist").write_text(src)
          print("wrote ios/ExportOptions.plist")
          PY

      - name: Build IPA
        working-directory: mobile
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: teremok-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        working-directory: mobile
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          ipa=(build/ios/ipa/*.ipa)
          xcrun altool --upload-app --type ios \
            --file "${ipa[0]}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
