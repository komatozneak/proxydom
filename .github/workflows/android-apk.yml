name: Android APK

# Compile smoke only. Not a PR check. Phone/sideload is build-sideload.ps1
# or Play Console. iOS stays on ios-testflight.yml.
on:
  workflow_dispatch:
    inputs:
      debug_build:
        description: "Build debug APK instead of release"
        required: false
        default: false
        type: boolean

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.1"
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate localization
        working-directory: mobile
        run: flutter gen-l10n

      - name: Build APK
        working-directory: mobile
        run: |
          if [ "${{ github.event.inputs.debug_build }}" = "true" ]; then
            echo "Building DEBUG APK per workflow_dispatch input..."
            flutter build apk --debug
          else
            echo "Building RELEASE APK (4 ABIs)..."
            flutter build apk --release
          fi

      - name: Verify CI APK exists
        run: |
          if [ "${{ github.event.inputs.debug_build }}" = "true" ]; then
            test -f mobile/build/app/outputs/flutter-apk/app-debug.apk
          else
            test -f mobile/build/app/outputs/flutter-apk/app-release.apk
          fi

      - name: Verify CI APK is not the production package
        working-directory: mobile
        run: |
          python3 <<'PY'
          import json, pathlib, sys
          debug = "${{ github.event.inputs.debug_build }}" == "true"
          variant = "debug" if debug else "release"
          expected = (
              "com.teremok.connect.teremok_connect.debug"
              if debug
              else "com.teremok.connect.teremok_connect.ci"
          )
          forbidden = "com.teremok.connect.teremok_connect"
          candidates = list(pathlib.Path("build/app/outputs").rglob("output-metadata.json"))
          matches = [p for p in candidates if variant in p.parts]
          meta_path = matches[0] if matches else (candidates[0] if candidates else None)
          if meta_path is None:
              sys.exit("missing Gradle output-metadata.json after flutter build apk")
          data = json.loads(meta_path.read_text(encoding="utf-8"))
          app_id = data.get("applicationId")
          print(f"metadata={meta_path} applicationId={app_id}")
          if app_id == forbidden:
              sys.exit("CI APK used production applicationId; refuse to upload")
          if app_id != expected:
              sys.exit(f"expected {expected}, got {app_id}")
          PY

      - name: Upload CI-only APK
        if: github.event.inputs.debug_build != true
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apk-ci
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload CI debug APK
        if: github.event.inputs.debug_build == true
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apk-ci-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
