name: Android APK

# Compile smoke only. Not a PR check. Phone/sideload is build-sideload.ps1
# or Play Console. iOS stays on ios-testflight.yml.
on:
  workflow_dispatch:
    inputs:
      debug_build:
        description: "Build debug APK instead of release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.1"
  JAVA_VERSION: "17"

jobs:
  # Its own machine, because this job used to build the archive inline and then
  # die with "No space left on device" while packaging the four-ABI APK.
  # The same split lives in mobile-build.yml.
  hy2bind-aar:
    name: Build hy2bind AAR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Build hysteria-client.aar
        uses: ./.github/actions/build-hy2bind-aar

      - name: Upload hysteria-client.aar
        uses: actions/upload-artifact@v4
        with:
          name: hy2bind-aar
          path: |
            mobile/android/app/libs/hysteria-client.aar
            mobile/android/app/libs/hysteria-client.aar.source-hash
          retention-days: 7
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: hy2bind-aar
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle*
            mobile/android/app/*.gradle*

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The APK links hy2bind through this archive, and the archive is not in
      # the repository.
      - name: Download hysteria-client.aar
        uses: actions/download-artifact@v4
        with:
          name: hy2bind-aar
          path: mobile/android/app/libs

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate localization
        working-directory: mobile
        run: flutter gen-l10n

      - name: Build APK
        working-directory: mobile
        env:
          DEBUG_BUILD: ${{ inputs.debug_build }}
        run: |
          if [ "$DEBUG_BUILD" = "true" ]; then
            echo "Building DEBUG APK per workflow_dispatch input..."
            flutter build apk --debug
          else
            echo "Building RELEASE APK (4 ABIs)..."
            flutter build apk --release --obfuscate --split-debug-info=build/symbols
          fi

      # Kept out of the APK; needed to deobfuscate a crash from this build.
      - name: Upload Dart symbols
        if: inputs.debug_build != true
        uses: actions/upload-artifact@v4
        with:
          name: proxydom-android-dart-symbols
          path: mobile/build/symbols/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify CI APK exists
        env:
          DEBUG_BUILD: ${{ inputs.debug_build }}
        run: |
          if [ "$DEBUG_BUILD" = "true" ]; then
            test -f mobile/build/app/outputs/flutter-apk/app-debug.apk
          else
            test -f mobile/build/app/outputs/flutter-apk/app-release.apk
          fi

      - name: Verify CI APK is not the production package
        working-directory: mobile
        env:
          DEBUG_BUILD: ${{ inputs.debug_build }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, sys
          debug = os.environ["DEBUG_BUILD"] == "true"
          variant = "debug" if debug else "release"
          expected = (
              "com.proxy.dom.debug"
              if debug
              else "com.proxy.dom.ci"
          )
          forbidden = "com.proxy.dom"
          candidates = list(pathlib.Path("build/app/outputs").rglob("output-metadata.json"))
          matches = [p for p in candidates if variant in p.parts]
          meta_path = matches[0] if matches else (candidates[0] if candidates else None)
          if meta_path is None:
              sys.exit("missing Gradle output-metadata.json after flutter build apk")
          data = json.loads(meta_path.read_text(encoding="utf-8"))
          app_id = data.get("applicationId")
          print(f"metadata={meta_path} applicationId={app_id}")
          if app_id == forbidden:
              sys.exit("CI APK used production applicationId; refuse to upload")
          if app_id != expected:
              sys.exit(f"expected {expected}, got {app_id}")
          PY

      # `inputs.debug_build` is a boolean; `github.event.inputs.debug_build` is
      # the string "true"/"false", and comparing that string with `true` made
      # the release upload run on every build and the debug upload on none.
      - name: Upload CI-only APK
        if: ${{ !inputs.debug_build }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-ci
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload CI debug APK
        if: ${{ inputs.debug_build }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-ci-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
