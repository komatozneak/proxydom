name: iOS Compile Check

# Compiles the app and the tunnel provider for iOS without any Apple account.
#
# The TestFlight workflow needs a signing certificate, and a signing failure
# says nothing about whether the Swift compiles: the archive never starts. This
# job builds the framework and runs `flutter build ios --no-codesign`, which
# type-checks and links every Swift file that ships in the app, using only the
# macOS runner. It uploads nothing and needs no secrets.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ios-compile.yml"
      - "mobile/ios/**"
      - "mobile/android/hysteria-bind/**"
      - "mobile/lib/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-compile.yml"
      - "mobile/ios/**"
      - "mobile/android/hysteria-bind/**"
      - "mobile/lib/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"

permissions:
  contents: read

# macOS minutes are the expensive ones: a newer push on the same ref cancels
# the run it supersedes.
concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.1"

jobs:
  compile:
    name: Build iOS without signing
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/android/hysteria-bind/go.mod
          cache-dependency-path: mobile/android/hysteria-bind/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # build-ios.sh runs the license guard itself before it binds.
      - name: Build Hy2bind.xcframework
        working-directory: mobile/android/hysteria-bind
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash build-ios.sh

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS app and extension (no code signing)
        working-directory: mobile
        run: flutter build ios --debug --no-codesign

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-log
          path: |
            mobile/build/ios/**/*.log
            mobile/ios/Pods/Target Support Files/**/*.log
          if-no-files-found: ignore
          retention-days: 7
