name: Windows Service

on:
  pull_request:
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-service.yml"
  push:
    branches: [main]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-service.yml"

concurrency:
  group: windows-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-tests:
    name: Service fault tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run fault tests
        shell: pwsh
        working-directory: desktop/windows/service
        run: |
          cmake -S . -B build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path (Get-Location) "build\Release"
          if (-not (Test-Path (Join-Path $bin "protocol_test.exe"))) {
            $bin = Join-Path (Get-Location) "build"
          }
          foreach ($name in @("protocol_test", "supervisor_test", "controller_test")) {
            & (Join-Path $bin "$name.exe")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Exit 2 means another full tunnel is active. That blocks Connect; it is not a dirty Proxy Dom route.
          & (Join-Path $bin "route_probe.exe")
          if ($LASTEXITCODE -eq 1) { exit 1 }
          exit 0

      - name: Prove controller to LocalSystem broker IPC
        shell: pwsh
        working-directory: desktop/windows/service
        run: |
          $bin = Join-Path (Get-Location) "build\Release"
          if (-not (Test-Path (Join-Path $bin "ProxyDomBroker.exe"))) {
            $bin = Join-Path (Get-Location) "build"
          }
          $broker = (Resolve-Path (Join-Path $bin "ProxyDomBroker.exe")).Path
          try {
            cmd.exe /c "sc.exe create ProxyDomBroker binPath= `"$broker`" start= demand"
            if ($LASTEXITCODE -ne 0) { throw "Service create failed." }
            cmd.exe /c "sc.exe start ProxyDomBroker"
            if ($LASTEXITCODE -ne 0) { throw "Service start failed." }
            $json = & (Join-Path $bin "ProxyDomCtl.exe") status
            if ($LASTEXITCODE -ne 0) { throw "Controller could not reach broker." }
            $state = $json | ConvertFrom-Json
            if ($state.event -ne "state" -or
                $state.state -ne "idle" -or
                $state.cleanup_verified -ne $true) {
              throw "Broker did not return a verified Idle snapshot: $json"
            }
          } finally {
            & sc.exe stop ProxyDomBroker | Out-Null
            Start-Sleep -Seconds 1
            & sc.exe delete ProxyDomBroker | Out-Null
          }
