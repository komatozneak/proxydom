name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
    inputs:
      debug_build:
        description: "Build debug APK instead of release"
        required: false
        default: "false"
        type: boolean

env:
  # rive_native 0.1.x needs SemanticsRole / isRequired (post-3.29).
  FLUTTER_VERSION: "3.35.1"
  JAVA_VERSION: "17"
  MIN_SDK: "23"

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify pubspec
        working-directory: mobile
        run: flutter pub deps --no-dev --style=tree

      - name: Run analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test --reporter expanded --dart-define=AUTH_ANONYMOUS=false

      - name: Verify minSdk = 23
        working-directory: mobile
        run: |
          # minSdk enforced via androidComponents.finalizeDsl (Flutter tooling
          # rewrites a literal `minSdk = 23` back to flutter.minSdkVersion).
          if grep -q "requiredMinSdk = ${{ env.MIN_SDK }}" android/app/build.gradle.kts \
            && grep -q "finalizeDsl" android/app/build.gradle.kts; then
            echo "minSdk enforcement OK (finalizeDsl -> ${{ env.MIN_SDK }})"
          else
            echo "minSdk enforcement missing! finalizeDsl hook removed or requiredMinSdk changed."
            exit 1
          fi

  build-android:
    name: Build Android APK
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate localization
        working-directory: mobile
        run: flutter gen-l10n

      - name: Build APK
        working-directory: mobile
        run: |
          if [ "${{ github.event.inputs.debug_build }}" = "true" ]; then
            echo "Building DEBUG APK per workflow_dispatch input..."
            flutter build apk --debug
          else
            echo "Building RELEASE APK (4 ABIs)..."
            flutter build apk --release
          fi

      - name: List build output
        working-directory: mobile
        run: |
          echo "=== APK files ==="
          ls -la build/app/outputs/flutter-apk/ || echo "no APK files"
          echo ""
          echo "=== Sizes ==="
          du -sh build/app/outputs/flutter-apk/*.apk 2>/dev/null || true

      # Compile must produce the universal APK; upload is best-effort so an
      # Actions storage-quota hit cannot fail an otherwise green build
      # (4× ABI uploads @ 30d previously exhausted the account).
      - name: Verify release APK exists
        run: test -f mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apk-universal
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Android Build Summary"
            echo ""
            echo "| Artifact | Path | Approx Size |"
            echo "|---|---|---|"
            echo "| Universal APK | android-apk-universal | ~110 MB |"
            echo ""
            echo "Retention: 7 days (universal only; ABI splits not uploaded)."
            echo "Upload is best-effort (continue-on-error) so storage quota"
            echo "cannot fail a green compile."
            echo ""
            echo "Local/Pixel: prefer \`flutter build apk --release --split-per-abi\`"
            echo "and install arm64-v8a for modern devices."
          } >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    name: Backend Integration Test (optional)
    runs-on: ubuntu-latest
    needs: build-android
    continue-on-error: true
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps
        working-directory: backend
        run: uv sync

      - name: Run backend integration tests
        working-directory: backend
        env:
          DEBUG_BYPASS_FLASH_CALL: "true"
          DEV_MOCK_VPN_CONFIG: "true"
          JWT_SECRET_KEY: "test-secret-do-not-use-in-prod"
        run: |
          uv run pytest tests/test_auth_refresh.py tests/test_vpn_endpoints.py -v --tb=short

  build-ios-no-codesign:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: mobile/build/ios/iphoneos/Runner.app
          retention-days: 14
          if-no-files-found: warn