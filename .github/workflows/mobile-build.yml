name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
      - ".github/actions/build-hy2bind-aar/**"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
      - ".github/actions/build-hy2bind-aar/**"

permissions:
  contents: read

# A new push on the same ref cancels the previous run. Minutes already
# spent are gone; stacked agent dispatches must not keep billing.
concurrency:
  group: mobile-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same toolchain in every workflow, so a PR builds what a release builds.
  FLUTTER_VERSION: "3.35.1"
  JAVA_VERSION: "17"

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test --reporter compact --dart-define=AUTH_ANONYMOUS=false

  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'mobile/android/hysteria-bind/**'
              - 'mobile/assets/legal/**'
              - '.github/workflows/mobile-build.yml'
              - '.github/actions/build-hy2bind-aar/**'
            android:
              - 'mobile/android/**'
              - 'mobile/pubspec.yaml'
              - 'mobile/pubspec.lock'
              - '.github/workflows/mobile-build.yml'
              - '.github/actions/build-hy2bind-aar/**'

  hy2bind-go-test:
    name: hy2bind Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/android/hysteria-bind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/android/hysteria-bind/go.mod
          cache-dependency-path: mobile/android/hysteria-bind/go.sum
      # The bind scripts refuse an untidy graph instead of rewriting it, so the
      # same check runs here, where it fails before any machine binds.
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi
      # Verbose so a known violation prints its warning.
      - name: License guard and third-party notices
        run: go test -count=1 -v -run 'TestLicenseGuard|TestLicenseClassifier|TestThirdPartyNotices' .
      - name: go test
        run: go test ./...
      # This job runs on ubuntu, so the Windows half of the engine is excluded
      # by build constraints and never compiled: cmd/proxydom-engine (all files
      # are `//go:build windows`), hy2bind_tun_windows.go and
      # hy2bind_protect_windows.go. That is the half the MSI carries, so
      # cross-compile it: the tests cannot run for another OS, but a compile
      # error is the failure that reaches the owner.
      - name: Cross-compile the Windows engine
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go vet ./...

  # Built once and handed to the Android jobs as an artifact. Building it inline
  # in each consumer looks simpler and is wrong: the bind pulls the Go module
  # cache, the Go build cache and four ABIs onto the same machine that then has
  # to package a four-ABI APK, and :device_info_plus:compileRelease died with
  # "No space left on device" when it was tried.
  hy2bind-aar:
    name: Build hy2bind AAR
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    # 387s measured for all four ABIs on a cold Go cache, against 26s warm.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Build hysteria-client.aar
        uses: ./.github/actions/build-hy2bind-aar

      # The sidecar travels with the archive. aar_stamp_test.go and
      # build-sideload.ps1 both refuse an archive whose hash disagrees with the
      # source, and both skip rather than fail when there is no archive at all.
      - name: Upload hysteria-client.aar
        uses: actions/upload-artifact@v4
        with:
          name: hy2bind-aar
          path: |
            mobile/android/app/libs/hysteria-client.aar
            mobile/android/app/libs/hysteria-client.aar.source-hash
          retention-days: 7
          if-no-files-found: error

  # flutter test does not compile Kotlin. PathHealth and socksWatchFor live
  # in the Android app module; this job is what actually runs them.
  # gradlew is gitignored (mobile/android/.gitignore). config-only injects it
  # and writes local.properties, then the unit-test task runs.
  android-unit-test:
    name: Android unit tests
    needs: [changes, hy2bind-aar]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle*
            mobile/android/app/*.gradle*

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # HysteriaBridge.kt imports hy2bind.Hy2bind, so the Kotlin in this job
      # links the archive. The archive is not in the repository, so the download
      # is what makes this check real: if the bind failed, there is nothing to
      # download and this step fails instead of the job quietly compiling
      # against a stale copy left on the runner.
      - name: Download hysteria-client.aar
        uses: actions/download-artifact@v4
        with:
          name: hy2bind-aar
          path: mobile/android/app/libs

      - name: Inject Gradle wrapper
        working-directory: mobile
        run: flutter build apk --config-only --debug

      - name: Unit tests
        working-directory: mobile/android
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
