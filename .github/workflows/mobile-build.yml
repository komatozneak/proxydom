name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
      - ".github/actions/build-hy2bind-aar/**"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
      - ".github/actions/build-hy2bind-aar/**"

# A new push on the same ref cancels the previous run. Minutes already
# spent are gone; stacked agent dispatches must not keep billing.
concurrency:
  group: mobile-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # rive_native 0.1.x needs SemanticsRole / isRequired (post-3.29).
  FLUTTER_VERSION: "3.35.1"
  JAVA_VERSION: "17"
  MIN_SDK: "26"
  # Matches ios-testflight.yml. build-aar.sh pins the same hysteria release.
  HYSTERIA_TAG: "v2.13.0"
  GO_VERSION: "1.25.x"

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify pubspec
        working-directory: mobile
        run: flutter pub deps --no-dev --style=tree

      - name: Run analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test --reporter compact --dart-define=AUTH_ANONYMOUS=false

      - name: Verify minSdk = 26
        working-directory: mobile
        run: |
          # minSdk enforced via androidComponents.finalizeDsl (Flutter tooling
          # rewrites a literal `minSdk` back to flutter.minSdkVersion).
          # ADR 018: Hy2 bind / VpnService requires 26.
          if grep -q "requiredMinSdk = ${{ env.MIN_SDK }}" android/app/build.gradle.kts \
            && grep -q "finalizeDsl" android/app/build.gradle.kts; then
            echo "minSdk enforcement OK (finalizeDsl -> ${{ env.MIN_SDK }})"
          else
            echo "minSdk enforcement missing! finalizeDsl hook removed or requiredMinSdk changed."
            exit 1
          fi

      - name: Verify non-production package suffixes
        working-directory: mobile
        run: |
          # debug/profile/CI must not occupy the Play/sideload applicationId.
          # Ids are set on ApplicationVariant (onVariants), not applicationIdSuffix:
          # Flutter 3.32–3.35 copies buildTypes onto library plugins (flutter#169215).
          if grep -q 'applicationId.set("$productionApplicationId.debug")' android/app/build.gradle.kts \
            && grep -q 'applicationId.set("$productionApplicationId.profile")' android/app/build.gradle.kts \
            && grep -q 'applicationId.set("$productionApplicationId.ci")' android/app/build.gradle.kts; then
            echo "package ids OK (.debug / .profile / .ci via onVariants)"
          else
            echo "onVariants applicationId for debug/profile/ci missing from build.gradle.kts"
            exit 1
          fi

  go-changes:
    name: Detect hy2bind changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'mobile/android/hysteria-bind/**'
              - 'mobile/assets/legal/**'
              - '.github/workflows/mobile-build.yml'
              - '.github/actions/build-hy2bind-aar/**'

  hy2bind-go-test:
    name: hy2bind Go tests
    needs: go-changes
    if: needs.go-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mobile/android/hysteria-bind/go.sum
      # Verbose so a known violation prints its warning; ADR 036.
      - name: License guard and third-party notices
        working-directory: mobile/android/hysteria-bind
        run: go test -count=1 -v -run 'TestLicenseGuard|TestLicenseClassifier|TestThirdPartyNotices' .
      - name: go test
        working-directory: mobile/android/hysteria-bind
        run: go test ./...
      # This job runs on ubuntu, so the Windows half of the engine is excluded
      # by build constraints and never compiled: cmd/proxydom-engine (all files
      # are `//go:build windows`), hy2bind_tun_windows.go and
      # hy2bind_protect_windows.go. That is the half the owner's machine
      # actually runs, and it is the half the MSI carries.
      #
      # Measured: changing StartShareTunStack to take an argument leaves
      # `GOOS=linux go build ./...` and `go vet ./...` both exiting 0 while
      # main.go no longer compiles. Green CI, broken installer. Cross-compile
      # instead. The tests cannot be run for another OS, but a compile error is
      # the failure that reaches the owner.
      - name: Cross-compile the Windows engine
        working-directory: mobile/android/hysteria-bind
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go vet ./...

  # Built once and handed to the Android jobs as an artifact. Building it inline
  # in each consumer looks simpler and is wrong: the bind pulls the Go module
  # cache, the Go build cache and four ABIs onto the same machine that then has
  # to package a four-ABI APK. Measured on a dispatch of android-apk.yml with
  # the bind inline: the bind succeeded, and :device_info_plus:compileRelease
  # Kotlin then died with "No space left on device". Keeping the Go work on its
  # own machine is what iOS already does with Hy2bind.xcframework.
  hy2bind-aar:
    name: Build hy2bind AAR
    runs-on: ubuntu-latest
    # 387s measured for all four ABIs on a cold Go cache, against 26s warm.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Build hysteria-client.aar
        uses: ./.github/actions/build-hy2bind-aar
        with:
          hysteria-tag: ${{ env.HYSTERIA_TAG }}
          go-version: ${{ env.GO_VERSION }}

      # The sidecar travels with the archive. aar_stamp_test.go and
      # build-sideload.ps1 both refuse an archive whose hash disagrees with the
      # source, and both skip rather than fail when there is no archive at all.
      - name: Upload hysteria-client.aar
        uses: actions/upload-artifact@v4
        with:
          name: hy2bind-aar
          path: |
            mobile/android/app/libs/hysteria-client.aar
            mobile/android/app/libs/hysteria-client.aar.source-hash
          retention-days: 7
          if-no-files-found: error

  # flutter test does not compile Kotlin. PathHealth and socksWatchFor live
  # in the Android app module; this job is what actually runs them.
  # gradlew is gitignored (mobile/android/.gitignore). config-only injects it
  # and writes local.properties, then the unit-test task runs.
  android-unit-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    needs: hy2bind-aar
    # No bind here any more: the archive arrives as an artifact, so this is back
    # to Flutter plus Gradle.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # HysteriaBridge.kt imports hy2bind.Hy2bind, so the Kotlin in this job
      # links the archive. The archive is not in the repository, so the download
      # is what makes this check real: if the bind failed, there is nothing to
      # download and this step fails instead of the job quietly compiling
      # against a stale copy left on the runner.
      - name: Download hysteria-client.aar
        uses: actions/download-artifact@v4
        with:
          name: hy2bind-aar
          path: mobile/android/app/libs

      - name: Inject Gradle wrapper
        working-directory: mobile
        run: flutter build apk --config-only --debug

      - name: Unit tests
        working-directory: mobile/android
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
