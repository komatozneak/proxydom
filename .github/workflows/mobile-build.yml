name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
    inputs:
      debug_build:
        description: "Build debug APK instead of release"
        required: false
        default: "false"
        type: boolean

env:
  FLUTTER_VERSION: "3.29.3"
  JAVA_VERSION: "17"
  MIN_SDK: "23"

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify pubspec
        working-directory: mobile
        run: flutter pub deps --no-dev --style=tree

      - name: Run analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test --reporter expanded

      - name: Verify minSdk = 23
        working-directory: mobile
        run: |
          # minSdk enforced via androidComponents.finalizeDsl (Flutter tooling
          # rewrites a literal `minSdk = 23` back to flutter.minSdkVersion).
          if grep -q "requiredMinSdk = ${{ env.MIN_SDK }}" android/app/build.gradle.kts \
            && grep -q "finalizeDsl" android/app/build.gradle.kts; then
            echo "minSdk enforcement OK (finalizeDsl -> ${{ env.MIN_SDK }})"
          else
            echo "minSdk enforcement missing! finalizeDsl hook removed or requiredMinSdk changed."
            exit 1
          fi

  build-android:
    name: Build Android APK
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate localization
        working-directory: mobile
        run: flutter gen-l10n

      - name: Build APK
        working-directory: mobile
        run: |
          if [ "${{ github.event.inputs.debug_build }}" = "true" ]; then
            echo "Building DEBUG APK per workflow_dispatch input..."
            flutter build apk --debug
          else
            echo "Building RELEASE APK (4 ABIs)..."
            flutter build apk --release
          fi

      - name: List build output
        working-directory: mobile
        run: |
          echo "=== APK files ==="
          ls -la build/app/outputs/flutter-apk/ || echo "no APK files"
          echo ""
          echo "=== Sizes ==="
          du -sh build/app/outputs/flutter-apk/*.apk 2>/dev/null || true

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-universal
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-armeabi-v7a
          path: mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-x86_64
          path: mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Android Build Summary"
            echo ""
            echo "| Artifact | Path | Approx Size |"
            echo "|---|---|---|"
            echo "| Universal APK | android-apk-universal | 108 MB |"
            echo "| arm64-v8a | android-apk-arm64-v8a | 74 MB |"
            echo "| armeabi-v7a | android-apk-armeabi-v7a | 71 MB |"
            echo "| x86_64 | android-apk-x86_64 | 75 MB |"
            echo ""
            echo "All artifacts retention: 30 days."
            echo ""
            echo "Download the right APK for your device:"
            echo "- Most modern Android devices -> **arm64-v8a**"
            echo "- Older devices 2018-2020 -> **armeabi-v7a**"
            echo "- Emulator on Mac/PC with Intel -> **x86_64**"
            echo "- Universal (all architectures) -> **android-apk-universal**"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    name: Backend Integration Test (optional)
    runs-on: ubuntu-latest
    needs: build-android
    continue-on-error: true
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install backend deps
        working-directory: backend
        run: uv sync

      - name: Run backend integration tests
        working-directory: backend
        env:
          DEBUG_BYPASS_FLASH_CALL: "true"
          DEV_MOCK_VPN_CONFIG: "true"
          JWT_SECRET_KEY: "test-secret-do-not-use-in-prod"
        run: |
          uv run pytest tests/test_auth_refresh.py tests/test_vpn_endpoints.py -v --tb=short

  build-ios-no-codesign:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: mobile/build/ios/iphoneos/Runner.app
          retention-days: 14
          if-no-files-found: warn