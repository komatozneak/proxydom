name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

# A new push on the same ref cancels the previous run. Minutes already
# spent are gone; stacked agent dispatches must not keep billing.
concurrency:
  group: mobile-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # rive_native 0.1.x needs SemanticsRole / isRequired (post-3.29).
  FLUTTER_VERSION: "3.35.1"
  JAVA_VERSION: "17"
  MIN_SDK: "26"

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify pubspec
        working-directory: mobile
        run: flutter pub deps --no-dev --style=tree

      - name: Run analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test --reporter compact --dart-define=AUTH_ANONYMOUS=false

      - name: Verify minSdk = 26
        working-directory: mobile
        run: |
          # minSdk enforced via androidComponents.finalizeDsl (Flutter tooling
          # rewrites a literal `minSdk` back to flutter.minSdkVersion).
          # ADR 018: Hy2 bind / VpnService requires 26.
          if grep -q "requiredMinSdk = ${{ env.MIN_SDK }}" android/app/build.gradle.kts \
            && grep -q "finalizeDsl" android/app/build.gradle.kts; then
            echo "minSdk enforcement OK (finalizeDsl -> ${{ env.MIN_SDK }})"
          else
            echo "minSdk enforcement missing! finalizeDsl hook removed or requiredMinSdk changed."
            exit 1
          fi

      - name: Verify non-production package suffixes
        working-directory: mobile
        run: |
          # debug/profile/CI must not occupy the Play/sideload applicationId.
          # Ids are set on ApplicationVariant (onVariants), not applicationIdSuffix:
          # Flutter 3.32–3.35 copies buildTypes onto library plugins (flutter#169215).
          if grep -q 'applicationId.set("$productionApplicationId.debug")' android/app/build.gradle.kts \
            && grep -q 'applicationId.set("$productionApplicationId.profile")' android/app/build.gradle.kts \
            && grep -q 'applicationId.set("$productionApplicationId.ci")' android/app/build.gradle.kts; then
            echo "package ids OK (.debug / .profile / .ci via onVariants)"
          else
            echo "onVariants applicationId for debug/profile/ci missing from build.gradle.kts"
            exit 1
          fi

  go-changes:
    name: Detect hy2bind changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'mobile/android/hysteria-bind/**'
              # The archive is a committed build product, and aar_stamp_test.go
              # checks it against the package source. Watching it here means the
              # check also runs when only the archive moved.
              - 'mobile/android/app/libs/hysteria-client.aar'
              - 'mobile/assets/legal/**'
              - '.github/workflows/mobile-build.yml'

  hy2bind-go-test:
    name: hy2bind Go tests
    needs: go-changes
    if: needs.go-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: mobile/android/hysteria-bind/go.sum
      # Verbose so a known violation prints its warning; ADR 036.
      - name: License guard and third-party notices
        working-directory: mobile/android/hysteria-bind
        run: go test -count=1 -v -run 'TestLicenseGuard|TestLicenseClassifier|TestThirdPartyNotices' .
      - name: go test
        working-directory: mobile/android/hysteria-bind
        run: go test ./...
      # This job runs on ubuntu, so the Windows half of the engine is excluded
      # by build constraints and never compiled: cmd/proxydom-engine (all files
      # are `//go:build windows`), hy2bind_tun_windows.go and
      # hy2bind_protect_windows.go. That is the half the owner's machine
      # actually runs, and it is the half the MSI carries.
      #
      # Measured: changing StartShareTunStack to take an argument leaves
      # `GOOS=linux go build ./...` and `go vet ./...` both exiting 0 while
      # main.go no longer compiles. Green CI, broken installer. Cross-compile
      # instead. The tests cannot be run for another OS, but a compile error is
      # the failure that reaches the owner.
      - name: Cross-compile the Windows engine
        working-directory: mobile/android/hysteria-bind
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build ./...
          go vet ./...

  # flutter test does not compile Kotlin. PathHealth and socksWatchFor live
  # in the Android app module; this job is what actually runs them.
  # gradlew is gitignored (mobile/android/.gitignore). config-only injects it
  # and writes local.properties, then the unit-test task runs.
  android-unit-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Inject Gradle wrapper
        working-directory: mobile
        run: flutter build apk --config-only --debug

      - name: Unit tests
        working-directory: mobile/android
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest --stacktrace
